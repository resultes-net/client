name: Create and publish Docker images

on:
  push:
    branches:
      - '*'

jobs:
  test-build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.READ_RESULTES_REPOS_APP_ID }}
          private-key: ${{ secrets.READ_RESULTES_REPOS_APP_KEY }}
          repositories: |
            client
            openapi-schema
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: 'true'
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client-npm-build Docker image
        run: |
          docker build -f docker/client/npm-build.Dockerfile -t client-npm-build .

      - name: Run unit tests
        run: |
          docker run --pull never client-npm-build npx vitest --run

      - name: Build client Docker image
        run: |
          docker build -f docker/client/Dockerfile -t ghcr.io/resultes-net/client:latest .

      - name: Push Docker image
        id: push
        run: |
          docker push ghcr.io/resultes-net/client:latest
